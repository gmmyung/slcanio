name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: All features
        run: cargo test --all-features --locked
      - name: Default features
        run: cargo test --locked
      - name: Core without default features
        run: cargo test --no-default-features --locked
      - name: Tokio without CAN FD
        run: cargo check --no-default-features --features tokio --all-targets --locked
      - name: Blocking without CAN FD
        run: cargo check --no-default-features --features blocking --all-targets --locked
      - name: Documentation
        run: cargo doc --all-features --no-deps --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --locked
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --json --output-path coverage.json --locked
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
  publish-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Publish coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_coverage_badge.py coverage.json
